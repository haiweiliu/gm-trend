<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Trend - Topics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #F8F9FC;
            color: #111827;
        }
        .nav-link {
            color: #4B5563;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-link:hover { color: #3B82F6; }
        .topic-card {
            background: white;
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .topic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="max-w-7xl mx-auto px-4 py-8">
        <nav class="flex items-center justify-between mb-8">
            <div class="flex items-center">
                <a href="home.html" class="text-gray-600 hover:text-gray-900 mr-4" aria-label="Back to home">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                </a>
                <h1 class="text-3xl font-bold">Topics</h1>
            </div>
            <div class="flex space-x-4">
                <a href="search.html" class="nav-link">Search</a>
                <a href="grid.html" class="nav-link">Grid</a>
            </div>
        </nav>

        <p class="text-gray-600 mb-8 max-w-2xl">
            Jump into curated Web3 topic searches. Each topic opens the search tool with a ready query.
        </p>

        <div id="topics" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <script>
        const topics = [
            { title: 'Bitcoin', query: 'bitcoin', blurb: 'BTC search interest and volume.' },
            { title: 'Ethereum', query: 'ethereum', blurb: 'ETH ecosystem demand signals.' },
            { title: 'Solana', query: 'solana', blurb: 'SOL network attention trends.' },
            { title: 'NFT', query: 'nft', blurb: 'Collectibles and marketplace interest.' },
            { title: 'AI Agent', query: 'ai agent', blurb: 'Agentic AI search momentum.' },
            { title: 'Web3', query: 'web3', blurb: 'Broader decentralized web interest.' },
            { title: 'DeFi', query: 'defi', blurb: 'Decentralized finance keywords.' },
            { title: 'Layer 2', query: 'layer 2', blurb: 'Scaling solutions and rollups.' },
            { title: 'Memecoin', query: 'memecoin', blurb: 'Community-token hype cycles.' }
        ];

        const root = document.getElementById('topics');
        root.innerHTML = topics.map((topic) => `
            <a class="topic-card block" href="search.html?q=${encodeURIComponent(topic.query)}">
                <h2 class="text-lg font-semibold text-blue-600">${topic.title}</h2>
                <p class="text-sm text-gray-500 mt-1">${topic.blurb}</p>
            </a>
        `).join('');
    </script>
</body>
</html>
